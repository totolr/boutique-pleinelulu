<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-symbole.png" />
    <link rel="apple-touch-icon" href="/logo-symbole.png" />

    <!-- SEO -->
    <title>Pleine Lulu - Boutique de l'association sportive</title>
    <meta
      name="description"
      content="Précommandez les t-shirts de l'association Pleine Lulu. Imprimés en France, 100% coton. 100% des bénéfices financent le football dans les quartiers populaires."
    />
    <meta name="keywords" content="association sportive, boutique, t-shirt, football, quartiers populaires, précommande, Nantes" />
    <link rel="canonical" href="https://pleinelulu.fr/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pleine Lulu - Boutique solidaire" />
    <meta
      property="og:description"
      content="Précommandez les t-shirts de l'asso. Chaque achat finance le sport pour tous."
    />
    <meta property="og:image" content="https://pleinelulu.fr/og-image.png" />
    <meta property="og:url" content="https://pleinelulu.fr/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pleine Lulu - Boutique solidaire" />
    <meta name="twitter:description" content="Précommandez les t-shirts pour soutenir le sport pour tous." />

    <!-- Structured data (Google rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Pleine Lulu",
        "description": "Boutique de l'association sportive Pleine Lulu",
        "url": "https://pleinelulu.fr"
      }
    </script>

    <!-- Leaflet : carte interactive de la zone de retrait (gratuit, sans clé API) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
