<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-symbole.png" />
    <link rel="apple-touch-icon" href="/logo-symbole.png" />

    <!-- SEO -->
    <title>Pleine Lulu - Boutique de l'association sportive</title>
    <meta
      name="description"
      content="Soutenez l'association sportive Pleine Lulu en portant nos couleurs. T-shirts, sweats et accessoires en coton bio. 100% des bénéfices reversés au sport pour tous."
    />
    <meta name="keywords" content="association sportive, boutique, t-shirt, sport, running, fitness, lyon" />
    <link rel="canonical" href="https://pleinelulu.netlify.app/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pleine Lulu - Boutique solidaire" />
    <meta
      property="og:description"
      content="T-shirts et sweats de l'asso. Chaque achat finance le sport pour tous."
    />
    <meta property="og:image" content="https://pleinelulu.netlify.app/og-image.png" />
    <meta property="og:url" content="https://pleinelulu.netlify.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pleine Lulu - Boutique solidaire" />
    <meta name="twitter:description" content="T-shirts et sweats pour soutenir le sport pour tous." />

    <!-- Structured data (Google rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Pleine Lulu",
        "description": "Boutique de l'association sportive Pleine Lulu",
        "url": "https://pleinelulu.netlify.app"
      }
    </script>
  </head>

    <div id="root"></div>
